name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android-app/gradlew || true

    - name: Generate Clean Release Keystore
      working-directory: android-app/app
      run: |
        keytool -genkey -v \
          -keystore upi_release.keystore \
          -alias upistream \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=UPIStreamAlert, OU=StreamAlert, O=Jaanedobhai, L=Delhi, S=Delhi, C=IN" \
          -storepass upistreamsecret123 \
          -keypass upistreamsecret123

    - name: Build Signed APKs with Gradle Wrapper
      working-directory: android-app
      run: |
        gradle wrapper --gradle-version 8.6
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UPI-StreamAlert-signed-apk
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
